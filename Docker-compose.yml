version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: MyBackend/Dockerfile
      args:
        CONFIGURATION: Release
    container_name: mybackend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION:-Server=host;Database=db;User Id=usr;Password=pwd;}
    ports:
      - "5000:80"   
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - appnet

  frontend:
    build:
      context: .
      dockerfile: MyFrontend/Dockerfile
      args:
        BASE_HREF: /
    container_name: myfrontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"   
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
